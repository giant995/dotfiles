# Set the default terminal terminfo
set -g default-terminal "screen-256color"
# Enable true color (24-bit RGB) for Neovim termguicolors
set-option -a terminal-features 'screen-256color:RGB'
# Enable scrolling
set -g mouse on

# Let tmux own the system clipboard (also lets programs like Neovim set it via OSC 52)
set -g set-clipboard on
# Plain mouse-drag highlights (no Shift needed) and stays scoped to the current pane only
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
# Copy the current selection to the system clipboard on demand
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Changer leader key from Ctrl+b to Ctrl+a
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Reduce Esc delay so Neovim feels responsive in insert mode
set-option -sg escape-time 10
# Forward focus events to Neovim (enables :autoread, etc.)
set-option -g focus-events on

# Open new split panes in the active pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# Restore tmux env after restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Continuously save the tmux env
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore sessions when tmux starts
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
